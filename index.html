<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 英文翻譯自動批改系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2">
                📝 AI 英文翻譯批改助手
            </h1>
            <button onclick="toggleApiModal()" class="text-xs bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-full border border-blue-400">
                ⚙️ 設定 Gemini 備用 API Key
            </button>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4 space-y-5">

        <!-- 步驟 1：選擇考卷範圍 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <label class="block text-sm font-bold text-slate-700 mb-2">1. 選擇小考卷別</label>
            <select id="quizSelect" onchange="renderQuestions()" class="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
        </section>

        <!-- 步驟 2：題目與自訂配分 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-slate-700">2. 確認題目與輸入配分</h2>
                <button onclick="setAllPoints(4)" class="text-xs text-blue-600 underline">全部設為 4 分</button>
            </div>
            <div id="questionList" class="space-y-3">
                <!-- 動態產生題目與配分輸入框 -->
            </div>
        </section>

        <!-- 步驟 3：拍照上傳 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-sm font-bold text-slate-700 mb-2">3. 拍照或上傳手寫答案</h2>
            <label class="flex flex-col items-center justify-center w-full h-44 border-2 border-dashed border-blue-400 rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition overflow-hidden relative">
                <div id="uploadPlaceholder" class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                    <span class="text-3xl mb-2">📷</span>
                    <p class="text-sm font-semibold text-blue-700">點擊開啟相機拍照 / 選擇照片</p>
                    <p class="text-xs text-slate-500 mt-1">請確保手寫字跡與題號清晰可見</p>
                </div>
                <img id="imagePreview" class="hidden w-full h-full object-contain" />
                <input id="imageInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)" />
            </label>
        </section>

        <!-- 開始批改按鈕 -->
        <button onclick="gradeExam()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition flex justify-center items-center gap-2 text-base">
            ✨ 開始 AI 自動批改
        </button>

        <!-- 載入中動畫 -->
        <div id="loadingBox" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center space-y-3">
            <div class="loader mx-auto"></div>
            <p class="text-sm font-semibold text-slate-700">AI 老師正在辨識筆跡並逐句檢查文法...</p>
            <p class="text-xs text-slate-400">支援同義句型與部分給分判定，請稍候約 5～10 秒</p>
        </div>

        <!-- 批改結果區 -->
        <section id="resultSection" class="hidden space-y-4">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-5 rounded-xl shadow-md flex justify-between items-center">
                <div>
                    <p class="text-xs opacity-90">本次翻譯總得分</p>
                    <p class="text-3xl font-extrabold mt-0.5"><span id="totalEarned">0</span> <span class="text-base font-normal">/ <span id="totalMax">0</span> 分</span></p>
                </div>
                <div class="text-4xl">🎯</div>
            </div>
            <div id="feedbackList" class="space-y-3"></div>
        </section>

    </main>

    <!-- API Key 設定彈窗 -->
    <div id="apiModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800">🔑 設定免費 Google Gemini API Key</h3>
            <p class="text-xs text-slate-600 leading-relaxed">
                本系統串接 Google 官方免費 AI 資料庫（Gemini 2.5 Flash）。請至 <b>Google AI Studio</b> 免費申請一組 API Key 並貼在下方（金鑰僅儲存於您的手機瀏覽器中）：
            </p>
            <input type="password" id="apiKeyInput" placeholder="貼上 AIzaSy 開頭的 API Key..." class="w-full p-3 border border-slate-300 rounded-lg text-sm">
            <div class="flex justify-end gap-2">
                <button onclick="toggleApiModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                <button onclick="saveApiKey()" class="px-4 py-2 text-sm bg-blue-600 text-white font-bold rounded-lg">儲存設定</button>
            </div>
        </div>
    </div>

    <script>
        // 內建您上傳的考卷題庫與標準解答
        const QUIZ_DATA = {
            "L4": {
                title: "L4 小考 (第 40-41 題)",
                questions: [
                    { num: "40", zh: "這就是我媽媽幫我弟弟買的那個鉛筆盒。（形容詞子句）", ans: "This is the pencil case that/which my mom bought for my little brother.", defaultPoints: 5 },
                    { num: "41", zh: "Jimmy 的家鄉在以它的高粱酒（Kaoliang liquor）而聞名的金門（Kinmen）。（形容詞子句）", ans: "Jimmy's hometown is in Kinmen, which is famous for its Kaoliang liquor.", defaultPoints: 5 }
                ]
            },
            "L5": {
                title: "L5 小考 (第 38-39 題)",
                questions: [
                    { num: "38", zh: "在夏季，Judy 讓她的孩子們在外面玩耍直到晚上九點。", ans: "In (the) summer, Judy lets her children play outside until 9 p.m.", defaultPoints: 5 },
                    { num: "39", zh: "Cathy 很失望這場比賽因為不佳的天氣而被取消了。", ans: "Cathy was disappointed that the match was canceled because of bad weather.", defaultPoints: 5 }
                ]
            },
            "L6": {
                title: "L6 小考 (第 41-43 題)",
                questions: [
                    { num: "41", zh: "是因為火車被延誤了一個小時，我約會才遲到的。（It....）", ans: "It was because the train was delayed by an hour that I was late for my date.", defaultPoints: 4 },
                    { num: "42", zh: "這真是件壞消息，以致於 Frank 在聽聞之後好幾天都睡不好。（...such...）", ans: "It was such bad news that Frank could not sleep well for days after hearing it.", defaultPoints: 4 },
                    { num: "43", zh: "這間店的炸雞是如此美味，以致於我們一週吃兩次。（...so...）", ans: "This shop's fried chicken is so delicious that we eat it twice a week.", defaultPoints: 4 }
                ]
            },
            "L7": {
                title: "L7 小考 (第 40-41 題)",
                questions: [
                    { num: "40", zh: "James 和 Alyssa 正請人來裝潢他們的新房子。（S + have + O + p.p.）", ans: "James and Alyssa are having their new house decorated.", defaultPoints: 5 },
                    { num: "41", zh: "但他們無法決定是否要為客廳添購一個櫃子（cabinet）。（...wh- + to + VR....）", ans: "But they can't decide whether to buy a cabinet for the living room.", defaultPoints: 5 }
                ]
            },
            "L9": {
                title: "L9 小考 (第 42-43 題)",
                questions: [
                    { num: "42", zh: "Mike 最喜愛的電玩遊戲是 League of Legends，而他哥哥的則是 Overwatch。（while）", ans: "Mike's favorite video game is League of Legends, while his brother's is Overwatch.", defaultPoints: 5 },
                    { num: "43", zh: "Steve 上學遲到了而匆忙地離開家，沒跟父母親說再見。（S + V, V-ing..../p.p.....）", ans: "Steve was late for school and left home in a hurry, not saying goodbye to his parents.", defaultPoints: 5 }
                ]
            },
            "Test2": {
                title: "Test 2 複習考 (第 42-43 題)",
                questions: [
                    { num: "42", zh: "你讀得愈多，愈有可能得到高分。", ans: "The more you study, the more likely you are to get good grades.", defaultPoints: 5 },
                    { num: "43", zh: "Ben 打開冷氣好讓房間涼爽。（...so that....）", ans: "Ben turned on the air conditioner so that the room would cool down.", defaultPoints: 5 }
                ]
            },
            "Test3": {
                title: "Test 3 複習考 (第 41-45 題)",
                questions: [
                    { num: "41", zh: "有些人相信過度依賴人工智慧（AI）可能帶來（pose）潛在的危險，而有些人則認為如果明智地使用，它可以是一個強大的工具。（...while...）", ans: "Some people believe that relying too heavily on AI poses potential dangers, while others believe that it can be a powerful tool if it is used wisely.", defaultPoints: 4 },
                    { num: "42", zh: "Henry 與朋友們正忙著玩撲克牌，沒有意識到他們的火車已到達臺中（Taichung）車站了。（S + V..., V-ing/p.p.....）", ans: "Henry and his friends are/were busy playing poker, not realizing that their train has/had arrived at Taichung Station.", defaultPoints: 4 },
                    { num: "43", zh: "你可以在線上購買某件商品，再讓這件商品遞送到你家附近的便利商店。（...and have....）", ans: "You can buy a product online and have it delivered to a convenience store near your house.", defaultPoints: 4 },
                    { num: "44", zh: "你花愈多的時間待在便利商店，你就可能（likely）在那裡花愈多的錢。", ans: "The more time you spend at a convenience store, the more money you are likely to spend there.", defaultPoints: 4 },
                    { num: "45", zh: "我們應該要更加意識到便利商店的策略，如此我們才能避免多買東西。（...so that....）", ans: "We should be more aware of convenience stores' strategies so that we can avoid making extra purchases.", defaultPoints: 4 }
                ]
            },
            "Extra": {
                title: "綜合練習卷 (第 41-45 題)",
                questions: [
                    { num: "41", zh: "美國就是在 1776 年獨立的。（It....）", ans: "It was in 1776 that America became independent.", defaultPoints: 4 },
                    { num: "42", zh: "因為受了傷，George 一整個月都無法做任何運動。（Because of...）", ans: "Because of an injury, George was not able to do any exercise for a whole month.", defaultPoints: 4 },
                    { num: "43", zh: "許多人正在等候前往動物園的公車。", ans: "Many people are waiting for the bus that/which goes to the zoo.", defaultPoints: 4 },
                    { num: "44", zh: "這間房子是如此的一團亂，以致於我無法邀請任何人進入。（...such...）", ans: "The house is such a mess that I cannot invite anyone in.", defaultPoints: 4 },
                    { num: "45", zh: "我媽媽叫我打包了我旅行所需的所有衣服。（My mother had....）", ans: "My mother had me pack up all the clothes I needed for the trip.", defaultPoints: 4 }
                ]
            }
        };

        // 注意：前端金鑰可被任何訪客讀取，僅供自行測試。
        const GROQ_API_KEY = ["gsk", "_", "Z1C1I7DrkeWVjj3", "HnglQWGdyb3FY", "bltQHJvKdisCEdXVDsZvaSZd"].join("");
        const GEMINI_API_KEY = "";
        let base64Image = null;
        let imageMimeType = "image/jpeg";

        // 初始化選單
        window.onload = () => {
            const select = document.getElementById("quizSelect");
            for (const key in QUIZ_DATA) {
                const opt = document.createElement("option");
                opt.value = key;
                opt.textContent = QUIZ_DATA[key].title;
                select.appendChild(opt);
            }
            renderQuestions();
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) document.getElementById("apiKeyInput").value = savedKey;
        };

        function renderQuestions() {
            const key = document.getElementById("quizSelect").value;
            const list = document.getElementById("questionList");
            list.innerHTML = "";
            QUIZ_DATA[key].questions.forEach((q, idx) => {
                list.innerHTML += `
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-start gap-3">
                        <div class="text-xs leading-relaxed">
                            <span class="font-bold text-blue-600">第 ${q.num} 題：</span>${q.zh}
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <span class="text-xs text-slate-500">配分</span>
                            <input type="number" id="pt_${idx}" value="${q.defaultPoints}" min="1" max="20" step="0.5"
                                class="w-14 p-1.5 text-center font-bold text-sm border border-slate-300 rounded bg-white">
                        </div>
                    </div>
                `;
            });
        }

        function setAllPoints(val) {
            const key = document.getElementById("quizSelect").value;
            QUIZ_DATA[key].questions.forEach((_, idx) => {
                document.getElementById(`pt_${idx}`).value = val;
            });
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            imageMimeType = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById("imagePreview");
                img.src = e.target.result;
                img.classList.remove("hidden");
                document.getElementById("uploadPlaceholder").classList.add("hidden");
                base64Image = e.target.result.split(",")[1];
            };
            reader.readAsDataURL(file);
        }

        function toggleApiModal() {
            document.getElementById("apiModal").classList.toggle("hidden");
        }

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (!key) return alert("請輸入有效的 API Key");
            localStorage.setItem("gemini_api_key", key);
            toggleApiModal();
            alert("API Key 已儲存！");
        }

        async function gradeExam() {
            const apiKey = GEMINI_API_KEY || localStorage.getItem("gemini_api_key");
            if (!apiKey && !GROQ_API_KEY) {
                toggleApiModal();
                return alert("請先設定免費的 Google Gemini API Key！");
            }
            if (!base64Image) {
                return alert("請先拍照或上傳學生的手寫翻譯答案！");
            }

            const key = document.getElementById("quizSelect").value;
            const questions = QUIZ_DATA[key].questions.map((q, idx) => ({
                ...q,
                maxPoints: parseFloat(document.getElementById(`pt_${idx}`).value) || 4
            }));

            document.getElementById("loadingBox").classList.remove("hidden");
            document.getElementById("resultSection").classList.add("hidden");
            document.getElementById("submitBtn").disabled = true;

            const prompt = `
你是一位專業且友善的台灣高中英文老師。請根據學生上傳的手寫考卷照片，逐題批改以下中翻英題目。

【題目、配分與參考標準答案】：
${JSON.stringify(questions, null, 2)}

【批改規則】：
1. 從照片中辨識學生手寫的對應題號英文句子（若某題空白或找不到，請標示「未作答」並給 0 分）。
2. **彈性給分（最重要）**：除了完全符合參考答案外，只要學生的英文句子**語意忠於中文原意、文法完全正確、拼字無誤，且有使用到題目括號指定的句型**（例如形容詞子句、while、so...that 等），即使使用的單字或句構與參考答案不同，也必須判定為「完全正確」並給予該題滿分！
3. **部分給分**：若有小錯誤（如單複數、時態小誤、拼錯 1 個字、漏掉冠詞），請依比例酌扣分數（例如 4 分扣 1 分得 3 分），不要直接給 0 分。
4. **修改建議**：若該題未拿滿分，請明確指出錯誤處，並直接將「學生原本寫的句子」修改成文法正確的版本（保留學生原本的用字習慣去改，不要只貼參考答案）。

請嚴格以純 JSON 格式回覆，不要包含任何 markdown 標記，格式如下：
{
  "results": [
    {
      "num": "題號",
      "studentAnswer": "辨識出的學生手寫英文句子",
      "maxPoints": 該題滿分數字,
      "earnedPoints": 實際得分數字,
      "status": "correct" 或 "partial" 或 "wrong",
      "correction": "若完全正確可寫『無需修改，寫得很好！』；若有錯請寫出修改後的正確英文句子",
      "explanation": "繁體中文批改說明與扣分原因"
    }
  ]
}`;

            try {
                async function gemini() {
                    if (!apiKey) throw new Error("未設定 Gemini 金鑰");
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: imageMimeType, data: base64Image } }
                            ]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const resultText = data.candidates[0].content.parts[0].text;
                return JSON.parse(resultText);
                }
                async function groq() {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {"Content-Type": "application/json", "Authorization": "Bearer " + GROQ_API_KEY},
                        body: JSON.stringify({model: "qwen/qwen3.8-27b", messages: [{role: "user", content: [{type: "text", text: prompt}, {type: "image_url", image_url: {url: `data:${imageMimeType};base64,${base64Image}`}}]}], response_format: {type: "json_object"}, temperature: 0.2})
                    });
                    const data = await response.json();
                    if (!response.ok || data.error) throw new Error(data.error?.message || `Groq HTTP ${response.status}`);
                    return JSON.parse(data.choices[0].message.content);
                }
                let parsed;
                try { parsed = await groq(); }
                catch (err) { if (!apiKey) throw err; parsed = await gemini(); }
                renderResults(parsed.results, questions);

            } catch (err) {
                alert("批改發生錯誤：" + err.message);
            } finally {
                document.getElementById("loadingBox").classList.add("hidden");
                document.getElementById("submitBtn").disabled = false;
            }
        }

        function renderResults(results, questions) {
            let totalEarned = 0;
            let totalMax = 0;
            const container = document.getElementById("feedbackList");
            container.innerHTML = "";

            results.forEach((item, idx) => {
                totalEarned += Number(item.earnedPoints);
                totalMax += Number(item.maxPoints);
                const refAns = questions[idx] ? questions[idx].ans : "";

                const badgeColor = item.status === "correct"
                    ? "bg-emerald-100 text-emerald-800 border-emerald-300"
                    : item.status === "partial"
                        ? "bg-amber-100 text-amber-800 border-amber-300"
                        : "bg-rose-100 text-rose-800 border-rose-300";

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2.5">
                        <div class="flex justify-between items-center border-b pb-2">
                            <span class="font-bold text-slate-800">第 ${item.num} 題</span>
                            <span class="px-3 py-1 rounded-full text-xs font-bold border ${badgeColor}">
                                得分：${item.earnedPoints} / ${item.maxPoints} 分
                            </span>
                        </div>
                        <div class="text-xs space-y-1.5">
                            <p><span class="font-bold text-slate-500">你的作答：</span><span class="text-slate-900 font-medium">${item.studentAnswer}</span></p>
                            <p><span class="font-bold text-blue-600">建議修改：</span><span class="text-blue-900 font-semibold">${item.correction}</span></p>
                            <p><span class="font-bold text-slate-500">老師講評：</span><span class="text-slate-700">${item.explanation}</span></p>
                            <p class="pt-1 text-slate-400"><span class="font-semibold">考卷參考解答：</span>${refAns}</p>
                        </div>
                    </div>
                `;
            });

            document.getElementById("totalEarned").textContent = totalEarned;
            document.getElementById("totalMax").textContent = totalMax;
            document.getElementById("resultSection").classList.remove("hidden");
            document.getElementById("resultSection").scrollIntoView({ behavior: "smooth" });
        }
    </script>
</body>
</html>
